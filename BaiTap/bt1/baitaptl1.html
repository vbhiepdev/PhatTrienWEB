<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
        crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body><div class="container">
      <section>
        <div class="flex">
          <div class="box1">1+2=</div>
          <div class="box2">3</div>
        </div>
      </section>
    <section class="row no-gutters">
      <div class="col-2"><button type="button" class="btn memory-button btn-block">MC</button></div>
      <div class="col-2"><button type="button" class="btn memory-button btn-block">MR</button></div>
      <div class="col-2"><button type="button" class="btn memory-button btn-block">M+</button></div>
      <div class="col-2"><button type="button" class="btn memory-button btn-block">M-</button></div>
      <div class="col-2"><button type="button" class="btn memory-button btn-block">MS</button></div>
      <div class="col-2"><button type="button" class="btn memory-button btn-block">M⌵</button></div>
    </section>
    
    <section class="row no-gutters">
      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3">%</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3">CE</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3">C</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3">⌫</button></div>

      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3">1/x</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3">x²</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3">²√x</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3">÷</button></div>

      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">7</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">8</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">9</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3 font-weight-bold">×</button></div>

      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">4</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">5</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">6</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3 font-weight-bold">−</button></div>

      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">1</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">2</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">3</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button emphasized-button btn-block py-3 font-weight-bold">+</button></div>

      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3">+/−</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">0</button></div>
      <div class="col-3 p-1"><button type="button" class="btn calculator-button btn-block py-3 font-weight-bold">.</button></div>
      <div class="col-3 p-1"><button type="button" class="btn equals-button btn-block py-3 font-weight-bold">=</button></div>
    </section>
    </div>
</body>
</html>
