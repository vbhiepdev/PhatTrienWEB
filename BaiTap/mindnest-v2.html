<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MINDNEST — Student Emotional Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#141824;--muted:#5d6678;--blue:#3d5afe;--line:#e4e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,sans-serif;background:radial-gradient(900px 420px at 90% -10%,#e7ebff,transparent 60%),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;background:rgba(244,246,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}
.bar{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center;background:none;border:0;color:inherit;cursor:pointer}
.logo{width:36px;height:36px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,a.btn{font-family:inherit;cursor:pointer}
.navbtn,.lang button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-weight:800;color:var(--muted);transition:all .2s ease}
.navbtn.on,.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,24,36,.08)}
.lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.cta{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 14px;font-weight:800;box-shadow:0 8px 20px rgba(61,90,254,.25);transition:transform .1s ease}
.cta:active{transform:scale(0.98)}
main{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:clamp(36px,6vw,58px);line-height:1.05;margin:12px 0;letter-spacing:-.03em}
h2{margin:0;letter-spacing:-.03em}
.muted{color:var(--muted);line-height:1.55}
.badge{display:inline-block;background:#fff;color:var(--blue);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:6px 10px;box-shadow:0 2px 6px rgba(20,24,36,.04)}
.grid{display:grid;gap:14px}
.cols2{grid-template-columns:1.2fr .8fr}
.cols3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 10px 30px rgba(20,24,36,.05)}
.blue{background:var(--blue);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.ghost{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:800;color:var(--ink)}
.kicker{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;margin-top:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:var(--ink)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.barline{height:6px;background:#eef1f8;border-radius:99px;margin-top:6px;overflow:hidden}
.barline span{display:block;height:6px;background:var(--blue);border-radius:99px;transition:width .4s ease}
footer{max-width:1040px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:14px}
@media(max-width:800px){.cols2,.cols3{grid-template-columns:1fr}nav.desktop{display:none}}
@media(min-width:801px){nav.mobile{display:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="brand" data-go="home"><span class="logo">M</span> Mindnest</button>
    <nav class="desktop" id="nav"></nav>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="lang"><button id="vi" type="button" aria-label="Tiếng Việt">VI</button><button id="en" type="button" aria-label="English">EN</button></div>
      <button class="cta" data-go="mood" id="checkin"></button>
    </div>
  </div>
  <div class="bar" style="padding-top:0"><nav class="mobile" id="navm"></nav></div>
</header>
<main id="app"></main>
<footer><strong id="footT" style="color:var(--ink)"></strong><p id="footB"></p></footer>

["Viết một việc đang kẹt bằng một câu rõ nghĩa.","Chia nhỏ thành phần có thể làm trong 15 phút.","Hết giờ là dừng, không ép bản thân làm quá tải.","Nếu kéo dài nhiều ngày, hãy chia sẻ với cố vấn học tập."],
["Tách bạch việc hôm nay và việc có thể dời lại.","Nhắn một câu làm rõ thời hạn, đừng tự đoán mò.","Nghỉ ngơi 5 phút trước khi đối diện tin nhắn căng thẳng.","Nếu môi trường xung quanh gây hại, hãy tìm sự trợ giúp chính thức."],

],

roles:["Phòng công tác sinh viên","Trung tâm tư vấn tâm lý","Đoàn thanh niên — Hội sinh viên","Khác"],want:"Bạn muốn tích hợp những tính năng nào?",saveN:"Lưu ghi chú hợp tác"
},
en:{
nav:["Home","MoodMap","Untangle","Guide","Campus"],check:"Check in",
footT:"MINDNEST does not replace professional counseling or clinical treatment.",
footB:"If you are in crisis, please contact someone you trust or local emergency support immediately.",

["Separate today's tasks from what can wait.","Clarify deadlines in a direct message instead of guessing.","Take a 5-minute break before handling tense communications.","If distress continues, connect with trusted support channels."],
["Name your feeling and rate its intensity from 1 to 5.","Drink water, adjust posture, and take slow, mindful breaths.","Text a trusted friend or peer to sit with you.","If you experience self-harm thoughts, contact emergency support right away. MINDNEST is not a crisis service."]
],
cT:"Inside the campus app",cL:"Emotion tracking tools situated alongside official campus counseling.",
models:[["B2C","Students access tools directly anytime."],["B2B","Schools embed the toolkit in portal dashboards or student apps."],["Content","Rooted in authentic student challenges, tailored for efficacy."]],
form:"Partnership note",formL:"Demo mode: data is stored locally on your device.",school:"School or organization",
roles:["Student Affairs","Counseling Center","Student Union","Other"],want:"What would you like to integrate?",saveN:"Save collaboration note"
}};

let lang = localStorage.getItem("mn.lang") || "vi";
let page = "home";
let mood = 0, level = 3, ctx = 0, topic = 0;
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function moods() {
  try { return JSON.parse(localStorage.getItem("mn.moods") || "[]"); } catch { return []; }
}

function renderNav() {
  const t = T[lang];
  const html = t.nav.map((n, i) => `<button class="navbtn ${pages[i]===page?"on":""}" data-go="${pages[i]}">${n}</button>`).join("");
  $("nav").innerHTML = html; 
  $("navm").innerHTML = html;
  $("checkin").textContent = t.check;
  $("vi").className = lang === "vi" ? "on" : ""; 
  $("en").className = lang === "en" ? "on" : "";
  $("footT").textContent = t.footT; 
  $("footB").textContent = t.footB;
  document.documentElement.lang = lang;
}

function home() {
  const t = T[lang];
  return `<div class="grid cols2">
    <div><span class="badge">${t.badge}</span><h1>${t.hero}</h1><p class="muted">${t.heroB}</p>
    <div class="row"><button class="cta" data-go="mood">${t.open}</button><button class="ghost" data-go="campus">${t.forC}</button></div></div>
    <aside class="card"><p class="kicker">${t.today}</p><ol style="margin:8px 0 0 20px;padding:0">${t.todayI.map(x=>`<li style="margin-bottom:6px">${x}</li>`).join("")}</ol></aside></div>
    <div class="grid cols3" style="margin-top:16px">${t.feats.map((f,i)=>`<button class="card" data-go="${pages[i+1]}" style="text-align:left;border:1px solid var(--line)"><p class="kicker">${f[0]}</p><h2 style="margin-top:10px;font-size:20px">${f[1]}</h2><p class="muted" style="margin-top:6px">${f[2]}</p></button>`).join("")}</div>
    <div class="grid cols2" style="margin-top:16px"><div class="card"><h2>${t.lifeT}</h2><p class="muted" style="margin-top:8px">${t.lifeB}</p></div>
    <div class="card blue"><p class="kicker" style="color:#fff">${t.nav[4]}</p><h2 style="margin-top:8px;color:#fff">${t.campT}</h2><p style="margin-top:8px;opacity:.9">${t.campB}</p><button class="ghost" data-go="campus" style="margin-top:12px">${t.see}</button></div></div>
    <h2 style="margin:28px 0 12px">${t.ship}</h2><div class="grid cols3">${t.road.map((r,i)=>`<div class="card"><b style="color:var(--blue)">0${i+1} ${r[0]}</b><div class="muted" style="margin-top:6px">${r[1]}</div></div>`).join("")}</div>`;
}

function moodPage() {
  const t = T[lang]; const items = moods();
  const counts = t.emo.map((_, i) => items.filter(x => x.emotion === i).length);
  const max = Math.max(1, ...counts);
  return `<p class="kicker">MoodMap</p><h1>${t.moodT}</h1><p class="muted">${t.moodL}</p>
  <div class="grid cols2" style="margin-top:14px"><div class="card"><p class="muted">${t.feel}</p>
  <div class="row">${t.emo.map((e,i)=>`<button type="button" class="chip ${mood===i?"on":""}" data-mood="${i}">${e}</button>`).join("")}</div>
  <label style="display:block;margin-top:14px;font-weight:700">${t.level} <span id="lvVal">${level}</span>/5<input id="lv" type="range" min="1" max="5" value="${level}"></label>
  <label style="display:block;margin-top:14px;font-weight:700">${t.context}<select id="cx">${t.ctx.map((c,i)=>`<option value="${i}" ${ctx==i?"selected":""}>${c}</option>`).join("")}</select></label>
  <label style="display:block;margin-top:14px;font-weight:700">${t.note}<textarea id="nt" rows="3" placeholder="${esc(t.ph)}"></textarea></label>
  <button class="cta" id="add" style="margin-top:16px">${t.save}</button></div>
  <div class="card"><p class="muted">${t.trend}</p>${t.emo.map((e,i)=>`<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-weight:700"><span>${e}</span><span>${counts[i]}</span></div><div class="barline"><span style="width:${counts[i]/max*100}%"></span></div></div>`).join("")}</div></div>
  <div style="margin-top:16px">${items.length?items.map(it=>`<div class="card" style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><b>${t.emo[it.emotion]||"?"} · ${it.intensity}/5 · ${t.ctx[it.context]||it.context}</b><small class="muted">${new Date(it.at).toLocaleString()}</small></div><div class="muted" style="margin-top:6px">${esc(it.note||"")}</div></div>`).join(""):`<p class="muted">${t.empty}</p>`}</div>`;
}

function untangle() {
  const t = T[lang];
  let savedAnswers = [];
  try { savedAnswers = JSON.parse(localStorage.getItem("mn.untangle") || "[]"); } catch {}
  return `<p class="kicker">Untangle</p><h1>${t.unT}</h1><p class="muted">${t.unL}</p>
  ${t.pr.map((p,i)=>`<div class="card" style="margin-top:12px"><b style="color:var(--blue)">0${i+1} ${p[0]}</b><p class="muted" style="margin:4px 0 8px">${p[1]}</p><textarea data-u="${i}" rows="3" placeholder="Nhập suy nghĩ của bạn...">${esc(savedAnswers[i]||"")}</textarea></div>`).join("")}
  <button class="cta" id="saveU" style="margin-top:16px">${t.saveR}</button>`;
}

function guide() {
  const t = T[lang];
  return `<p class="kicker">${t.nav[3]}</p><h1>${t.gT}</h1><p class="muted">${t.gL}</p>
  <div class="row">${t.topics.map((x,i)=>`<button type="button" class="chip ${topic===i?"on":""}" data-topic="${i}">${x}</button>`).join("")}</div>
  <div style="margin-top:16px" class="grid">${t.steps[topic].map((s,i)=>`<div class="card" style="display:flex;gap:16px;align-items:flex-start"><span class="badge" style="background:#e7ebff">0${i+1}</span><div style="flex:1">${s}</div></div>`).join("")}</div>`;
}

function campus() {
  const t = T[lang];
  return `<p class="kicker">Campus</p><h1>${t.cT}</h1><p class="muted">${t.cL}</p>
  <div class="grid cols3" style="margin-top:16px">${t.models.map(m=>`<div class="card"><h2 style="font-size:20px">${m[0]}</h2><p class="muted" style="margin-top:8px">${m[1]}</p></div>`).join("")}</div>
  <form class="card" id="cf" style="margin-top:16px;max-width:560px"><h2 style="font-size:22px">${t.form}</h2><p class="muted" style="margin-top:4px">${t.formL}</p>
  <label style="display:block;margin-top:12px;font-weight:700">${t.school}<input required name="school" placeholder="VD: ĐH Quốc gia..."></label>
  <label style="display:block;margin-top:12px;font-weight:700">Vai trò<select name="role">${t.roles.map(r=>`<option>${esc(r)}</option>`).join("")}</select></label>
  <label style="display:block;margin-top:12px;font-weight:700">${t.want}<textarea name="note" rows="3" placeholder="Chia sẻ thêm nhu cầu tích hợp..."></textarea></label>
  <button class="cta" style="margin-top:16px">${t.saveN}</button><p id="ok" class="kicker" style="margin-top:8px"></p></form>`;
}

function draw() {
  renderNav();
  const view = {home, mood: moodPage, untangle, guide, campus}[page];
  $("app").innerHTML = view();

  const lv = $("lv");
  if(lv) lv.oninput = e => { 
    level = +e.target.value; 
    const lvVal = $("lvVal");
    if(lvVal) lvVal.textContent = level; 
  };

  const cx = $("cx"); 
  if(cx) cx.onchange = e => { ctx = +e.target.value; };

  const add = $("add"); 
  if(add) add.onclick = () => {
    const ntElem = $("nt");
    const note = ntElem ? ntElem.value.trim() : "";
    const all = [{emotion: mood, intensity: level, context: ctx, note, at: new Date().toISOString()}, ...moods()].slice(0, 40);
    try { localStorage.setItem("mn.moods", JSON.stringify(all)); } catch {}
    draw();
  };

  document.querySelectorAll("[data-mood]").forEach(b => b.onclick = () => { mood = +b.dataset.mood; draw(); });
  document.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { topic = +b.dataset.topic; draw(); });

  const su = $("saveU"); 
  if(su) su.onclick = () => {
    const answers = [...document.querySelectorAll("[data-u]")].map(el => el.value);
    try { localStorage.setItem("mn.untangle", JSON.stringify(answers)); } catch {}
    su.textContent = T[lang].saved;
    setTimeout(() => { su.textContent = T[lang].saveR; }, 2000);
  };

  const cf = $("cf"); 
  if(cf) cf.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(cf);
    let prev = [];
    try { prev = JSON.parse(localStorage.getItem("mn.campus") || "[]"); } catch {}
    prev.unshift({school: fd.get("school"), role: fd.get("role"), note: fd.get("note"), at: new Date().toISOString()});
    try { localStorage.setItem("mn.campus", JSON.stringify(prev.slice(0, 20))); } catch {}
    $("ok").textContent = T[lang].saved; 
    cf.reset();
  };
}

document.body.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if(!go) return;
  page = go.dataset.go; 
  draw(); 
  window.scrollTo(0, 0);
});

$("vi").onclick = () => { lang = "vi"; localStorage.setItem("mn.lang","vi"); draw(); };
$("en").onclick = () => { lang = "en"; localStorage.setItem("mn.lang","en"); draw(); };

draw();
</script>
</body>
</html>
